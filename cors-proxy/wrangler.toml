name = "canvas-cors-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV namespace for the .ics subscription feed. Create with:
#   wrangler kv:namespace create ICAL_KV
# then paste the returned id below. Optional — the proxy still works
# for Canvas API calls without it; only /calendar/* routes need it.
#
# [[kv_namespaces]]
# binding = "ICAL_KV"
# id = "PUT_KV_NAMESPACE_ID_HERE"
#
# No worker secrets required. PUT /calendar/<courseKey>.ics auth is
# per-professor — the worker validates the caller's Canvas PAT against
# Canvas itself and only accepts writes from users with teacher-level
# permissions on the course identified in the URL.

[[kv_namespaces]]
binding = "ICAL_KV"
id = "31d8ec840cf041e0b0c2bcb71a6410aa"
